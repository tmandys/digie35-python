# Built-in defaults for a camera used to scan film.
#
# The values in the default and override sections are logical values shown in
# the UI. A mapping translates them to the value exposed by a specific
# libgphoto2 driver. User profiles store concrete gphoto2 IDs and only their
# overrides; this file remains upgradeable with Digie35.
schema_version: 1
profile_version: 1
id: default-scan
label: Default film-scanning camera setup

parameters:
  exposure_mode:
    label: Exposure mode
    group: primary
    default:
      set: Av
      check: Av
    mapping:
      canon:
        id: /main/capturesettings/autoexposuremode
        values:
          Av: AV
      sony:
        id: /main/other/500e
        values:
          Av: 3
      nikon:
        id: /main/other/500e
        values:
          Av: 3

  aperture:
    label: Aperture
    group: primary
    default:
      set: f/8
      check: f/8
    overrides:
      focusing:
        set: f/2.8
    mapping:
      default:
        id: /main/capturesettings/aperture
      sony:
        id: /main/capturesettings/f-number
      nikon:
        id: /main/capturesettings/f-number

  iso:
    label: ISO
    group: primary
    default:
      set: "100"
      check: "100"
    mapping:
      default:
        id: /main/imgsettings/iso

  focus_mode:
    label: Focus mode
    group: primary
    default:
      check: manual_focus
    overrides:
      focusing:
        set: manual_focus
    mapping:
      default:
        id: /main/capturesettings/focusmode
        values:
          manual_focus: Manual Focus
      sony:
        id: /main/capturesettings/focusmode
        values:
          manual_focus: Manual Focus
      nikon:
        id: /main/capturesettings/focusmode
        values:
          manual_focus: Manual

  aeb:
    label: Exposure bracketing
    group: primary
    default:
      check: off
      blocking: true
    mapping:
      canon:
        id: /main/capturesettings/aeb
        values:
          off: "off"
      sony:
        id: /main/capturesettings/capturemode
        check_not_matching: Bracketing
      nikon:
        id: /main/capturesettings/bracketmode
        values:
          off: "Off"
